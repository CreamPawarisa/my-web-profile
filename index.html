<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โปรไฟล์ของฉัน</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <header>
      <span class="badge">✨ Welcome to my GitHub</span>
      <h1>สวัสดีค่ะ</h1>
      <p class="subtitle">นี่คือเว็บโปรไฟล์ของฉันบน GitHub</p>
      
      <div class="info-pills">
        <span>🐾 ชื่อเล่น : <strong>ครีม</strong></span>
        <span>💻 กำลังเรียน : <strong>GitHub Desktop</strong></span>
      </div>
    </header>

    <main>
      <section class="card">
        <div class="avatar-wrapper">
          <img src="gender_3066802.png" alt="รูปโปรไฟล์ตัวอย่าง">
        </div>
        
        <h2 id="profile-name">ปวริศา ชูรัตน์</h2>
        <p class="bio">💻 IT girl | 🍵 Matcha latte addict | 🐱 Cat mom | 🌿 Nature lover</p>

        <hr class="divider">

        <h3>ทักษะของฉัน</h3>
        <ul class="skills-list">
          <li>🎨 การออกแบบกราฟิก</li>
          <li>🗣️ การพูดภาษาอังกฤษ</li>
          <li>🎸 ความสามารถด้านดนตรี</li>
        </ul>
      </section>
    </main>
  </div>

</body>
</html>
